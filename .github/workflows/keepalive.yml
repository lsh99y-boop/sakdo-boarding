name: Supabase Keepalive

# 무료 Supabase는 7일간 요청이 없으면 자동 일시정지됩니다.
# 3일마다 REST API에 가벼운 요청을 보내 프로젝트를 깨어 있게 유지합니다.
# (anon/publishable 키는 공개용이라 워크플로에 그대로 둬도 안전합니다.)

on:
  schedule:
    - cron: "0 6 */3 * *"   # 3일마다 06:00 UTC
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://corgddhyokbylsfdclps.supabase.co/rest/v1/sakdo_config?select=id&limit=1" \
            -H "apikey: sb_publishable_OVLf_f8LN0gRZlR-8eGTdA_v6DxLLjb" \
            -H "Authorization: Bearer sb_publishable_OVLf_f8LN0gRZlR-8eGTdA_v6DxLLjb")
          echo "HTTP $CODE"
          # 2xx 면 성공
          case "$CODE" in
            2*) echo "Supabase alive"; exit 0 ;;
            *)  echo "Unexpected status: $CODE"; exit 1 ;;
          esac
